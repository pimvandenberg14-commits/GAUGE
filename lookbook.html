<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lookbook | GAUGE</title>
<meta name="description" content="GAUGE lookbook — Autumn / Winter 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body data-page="lookbook">

<header class="header" id="header"></header>

<main>
  <div class="section-head section-head--page">

  <!-- Alle tien lookbookfoto's, afwisselend groot en klein -->

      <figure class="look big reveal">

      </figure>
      <figure class="look small reveal">

      </figure>
    </div>

      <figure class="look small reveal">
        <div class="ph" data-ph="lookbook/07.jpg"><img src="lookbook/07.jpg" alt="Look 03 — charcoal hoodie, back view" loading="lazy"></div>
        <figcaption class="label">Look 03</figcaption>
      </figure>
      <figure class="look big reveal">
        <div class="ph" data-ph="lookbook/06.jpg"><img src="lookbook/06.jpg" alt="Look 04 — ecru hoodie with trousers, side view" loading="lazy"></div>

      <figure class="look big reveal">
        <div class="ph" data-ph="lookbook/09.jpg"><img src="lookbook/09.jpg" alt="Look 05 — navy ribbed cardigan" loading="lazy"></div>

      </figure>

        <figcaption class="label">Look 10</figcaption>
      </figure>
    </div>

  <div class="grid-foot"><a class="btn" href="shop.html">Shop the collection</a></div>
